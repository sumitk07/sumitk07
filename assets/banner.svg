<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#1c3557"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <!-- small retrieval graph: query nodes linking to passage nodes -->
  <g stroke="#4f86c6" stroke-width="1.4" opacity="0.55">
    <line x1="640" y1="55" x2="760" y2="40"/><line x1="640" y1="55" x2="760" y2="95"/>
    <line x1="640" y1="100" x2="760" y2="95"/><line x1="640" y1="100" x2="760" y2="150"/>
    <line x1="640" y1="145" x2="760" y2="150"/><line x1="640" y1="145" x2="760" y2="95"/>
    <line x1="760" y1="40" x2="850" y2="70"/><line x1="760" y1="95" x2="850" y2="70"/>
    <line x1="760" y1="150" x2="850" y2="130"/><line x1="760" y1="95" x2="850" y2="130"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="640" cy="55" r="16" fill="#e08a2c"/><text x="640" y="60" fill="#0f1b2d">EN</text>
    <circle cx="640" cy="100" r="16" fill="#e08a2c"/><text x="640" y="105" fill="#0f1b2d">HI</text>
    <circle cx="640" cy="145" r="16" fill="#e08a2c"/><text x="640" y="150" fill="#0f1b2d">JA</text>
  </g>
  <g fill="#7fb0e6"><circle cx="760" cy="40" r="7"/><circle cx="760" cy="95" r="7"/><circle cx="760" cy="150" r="7"/></g>
  <g fill="#cfe1f5"><circle cx="850" cy="70" r="9"/><circle cx="850" cy="130" r="9"/></g>
  <text x="44" y="82" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Sumit Kumar</text>
  <text x="46" y="118" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#cfe1f5">Information retrieval · NLP · Federated learning</text>
  <text x="46" y="150" font-family="Menlo, Consolas, monospace" font-size="14" fill="#7fb0e6">query(en | hi) → search(ja) → answer</text>
</svg>
